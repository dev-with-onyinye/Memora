services:
  postgres:
    image: postgres:16
    container_name: memora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: memora
      POSTGRES_PASSWORD: memora
      POSTGRES_DB: memora
    ports:
      - "5433:5432"
    volumes:
      - memora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memora -d memora"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  memora_postgres_data:
    name: memora_postgres_data
